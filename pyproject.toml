[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semeval-task3-project"
version = "0.1.0"
description = "SemEval 2027 Task 3 Subtask 2 evaluation harness"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "scikit-learn", "bcubed"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

